<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dessert Sacré | Perfil</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles/perfil.css') }}"
    />
    <link
      rel="icon"
      type="image/x-icon"
      href="{{ url_for('static', filename='img/dessert_sacre_icon.ico') }}?v=1"
    />
  </head>
  <body>
    {% include 'users/navbar1.html' %}

    <a
      href="https://wa.me/573025662571?text=Hola,%20quiero%20presentar%20una%20inquietud%20sobre%20Dessert%20Sacré"
      class="whatsapp-float"
      target="_blank"
    >
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
        alt="WhatsApp"
      />
    </a>

    <div class="container">
      <!-- ENCABEZADO -->
      <div class="perfil-header">
        <div class="avatar">{{ usuario.nombre[0] | upper }}</div>
        <div>
          <h1>{{ usuario.nombre }}</h1>
          <span class="subtitulo">Cuenta activa</span>
        </div>
      </div>

      <!-- DATOS PERSONALES -->
<div class="card">
  <h3>Datos personales</h3>

  <div id="perfil-status"></div>

  <form id="form-perfil">
    <div class="datos-grid">
      <div class="dato">
        <span class="label">Correo</span>
        <span class="valor">{{ usuario.email }}</span>
      </div>
      <div class="dato">
        <span class="label">Teléfono</span>
        <input
          type="text"
          name="telefono"
          class="input-editable"
          value="{{ usuario.telefono or '' }}"
        />
      </div>
      <div class="dato">
        <span class="label">Dirección</span>
        <input
          type="text"
          name="direccion"
          class="input-editable"
          value="{{ usuario.direccion or '' }}"
        />
      </div>
    </div>
    <button type="submit" id="btn-guardar-perfil" class="btn-guardar-perfil" style="display: none;">Guardar cambios</button>
  </form>
</div>

<script>
  const formPerfil   = document.getElementById("form-perfil");
  const btnGuardar   = document.getElementById("btn-guardar-perfil");
  const inputs       = formPerfil.querySelectorAll(".input-editable");

  // Guarda los valores originales para poder comparar
  const valoresOriginales = {};
  inputs.forEach((input) => {
    valoresOriginales[input.name] = input.value;
  });

  function hayCambios() {
    return Array.from(inputs).some(
      (input) => input.value.trim() !== valoresOriginales[input.name].trim()
    );
  }

  function actualizarVisibilidadBoton() {
    btnGuardar.style.display = hayCambios() ? "inline-block" : "none";
  }

  inputs.forEach((input) => {
    input.addEventListener("input", actualizarVisibilidadBoton);
  });

  formPerfil.addEventListener("submit", async (e) => {
    e.preventDefault();

    const telefono = e.target.telefono.value.trim();
    const direccion = e.target.direccion.value.trim();
    const status = document.getElementById("perfil-status");

    try {
      const res = await fetch("/api/actualizar_perfil", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ telefono, direccion }),
      });
      const data = await res.json();

      if (data.success) {
        status.innerHTML = `
          <div class="alert alert-success alert-dismissible fade show" role="alert">
            Datos actualizados correctamente.
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>`;

        // Actualiza los valores "originales" con los recién guardados
        // y oculta el botón de nuevo
        valoresOriginales.telefono = telefono;
        valoresOriginales.direccion = direccion;
        actualizarVisibilidadBoton();
      } else {
        status.innerHTML = `
          <div class="alert alert-danger alert-dismissible fade show" role="alert">
            ${data.error || "No se pudo actualizar."}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>`;
      }
    } catch {
      status.innerHTML = `
        <div class="alert alert-danger alert-dismissible fade show" role="alert">
          Error de red al actualizar.
        </div>`;
    }
  });
</script>

    {% include 'users/footer1.html' %}
  </body>

</html>
